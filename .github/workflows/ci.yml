#
# Three platforms, each running the whole thing: bridge/build.sh (SBCL from
# source, OpenLDK, the core, the shim), every test with JOLT_OPENLDK_REQUIRE=1
# so nothing passes by skipping, and the tour.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned, as elsewhere in jlt-commons: "latest" is an API lookup that the
# parallel jobs would rate-limit, and a new release would change what CI runs.
env:
  JOLT_VERSION: "0.8.20"
  BB_VERSION: "1.13.225"
  CLJ_KONDO_VERSION: "2026.05.25"
  OCICL_VERSION: "2.20.0"
  OCICL_SHA256_AMD64: 9fef518f8c20b12ce63ca6103d6224019e9b0a546ead5fc3f9a85e75b9d74050

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ env.BB_VERSION }}
          clj-kondo: ${{ env.CLJ_KONDO_VERSION }}
      - run: bb lint

  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.JOLT_VERSION }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: ${{ env.BB_VERSION }}
      - name: Install SBCL (the host that compiles SBCL 2.6.9) and ocicl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbcl libzstd-dev zlib1g-dev liblz4-1 libtinfo6
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/ocicl.tgz \
            "https://github.com/ocicl/ocicl/releases/download/v${OCICL_VERSION}/ocicl-${OCICL_VERSION}-linux-amd64.tar.gz"
          echo "${OCICL_SHA256_AMD64}  /tmp/ocicl.tgz" | sha256sum -c -
          tar -xzf /tmp/ocicl.tgz -C /tmp ./ocicl
          sudo install -m 755 /tmp/ocicl /usr/local/bin/ocicl
      # SBCL is the slow part and depends only on its version and the build
      # script; the core and shim are rebuilt every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jolt-openldk/work/sbcl-2.6.9
          key: sbcl-2.6.9-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bridge/build.sh') }}
      - name: Build
        run: bridge/build.sh
      - name: Test
        run: JOLT_OPENLDK_REQUIRE=1 bb test
      - name: Tour
        run: bb tour

  # jolt and ocicl publish no Linux arm64 binaries, so this goes through
  # linux/Dockerfile, which builds both from their tags: the same image and
  # check script `bb linux` runs locally.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t jolt-openldk-linux linux/
      - name: Build and test inside it
        run: docker run --rm -v "$PWD":/src:ro jolt-openldk-linux /src/linux/check.sh

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.JOLT_VERSION }}
      - name: Install SBCL, ocicl, babashka and clj-kondo
        run: brew install sbcl ocicl borkdude/brew/babashka borkdude/brew/clj-kondo
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jolt-openldk/work/sbcl-2.6.9
          key: sbcl-2.6.9-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bridge/build.sh') }}
      - name: Build
        run: bridge/build.sh
      - name: Test
        run: JOLT_OPENLDK_REQUIRE=1 bb test
      - name: Tour
        run: bb tour
